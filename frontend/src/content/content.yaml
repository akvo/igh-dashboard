  reports:
    cards:
      "1":
        description: An overview of key takeaways from the G-FINDER survey
        image: https://cdn.impactglobalhealth.org/media/2025%20G-FINDER%20cover-404x341.webp
        title: Funding for global health R&D in 2024
        url: https://www.impactglobalhealth.org/insights/report-library/funding-for-global-health-rd-in-2024
      "2":
        description: Executive briefing presenting findings from three case studies demonstrating how selected global health innovations enhance health outcomes and provide economic value across the US, UK, Japan, and Europe.
        image: https://cdn.impactglobalhealth.org/media/Ripple%20effect%202.0%20image.jpg
        title: "The Ripple Effect 2.0: from global health to domestic value"
        url: https://www.impactglobalhealth.org/insights/report-library/ripple-effect-2
      "3":
        description: The 100 Days Mission's 5th Implementation Report and Scorecard highlight limited progress has been made in an R&D ecosystem that remains reactive and reliant on US funding.
        image: https://cdn.impactglobalhealth.org/media/Untitled%20design%20(7)-404x404.webp
        title: "100 Days Mission: 5th Implementation Report and Scorecard"
        url: https://www.impactglobalhealth.org/insights/report-library/ipps-report-2026
