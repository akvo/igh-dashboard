pipeline_explorer:
  visual_insights:
    approved:
      approval_status:
        description: This chart shows the total number of approved products by approval status. Each bar represents a specific approval status, enabling quick comparison across statuses.
        title: Approval status
      approving_auth:
        description: The chart compares the number of approved products by approving authorities, and the number of those products with WHO prequalification.
        title: Approving authorities
      intro: Three summary charts cover approval status, approving authorities and WHO prequalification. A searchable table below lists every approved product matching the page-level filters.
      table:
        description: A row-by-row view of every approved product matching the page-level filters. Use the per-column filters below each header to narrow further, then export the matching rows to .csv.
        empty: No approved products found
        title: Selected approved products
      who_prequal:
        description: A comparison of approved products that have a WHO prequalification. The WHO prequalification is a 'gold standard' for products intended for use in low- and middle-income countries.
        title: WHO prequalification
      kpi:
        emerging: The number of those approved products addressing emerging infectious diseases.
        neglected_diseases: The number of those approved products addressing neglected diseases.
        total: The number of approved health products that match the current filters.
        womens_health: The number of those approved products addressing women's health conditions.
      top5_disease:
        title: Top 5 diseases by approved product count
        description: Ranks the five diseases with the most approved products, with bars colour-coded by global health area. Reflects the active filters.
      top5_product:
        title: Top 5 product types by approved product count
        description: Ranks the five product types with the most approved products. Reflects the active filters.
    candidates:
      table:
        description: "A matrix of candidates scoped by the page-level filters, with per-column filters below each header to narrow further. Each row gives candidate-level detail: name, R&D stage, developer, indication and more."
        empty: No candidates found
        title: Selected candidates
      kpi:
        emerging: The number of those candidates addressing emerging infectious diseases.
        neglected_diseases: The number of those candidates addressing neglected diseases.
        total: The number of active candidates in development that match the current filters.
        womens_health: The number of those candidates addressing women's health conditions.
      top5_disease:
        title: Top 5 diseases by candidate count
        description: Ranks the five diseases with the most candidates, with bars colour-coded by global health area. Reflects the active filters.
      top5_product:
        title: Top 5 product types by candidate count
        description: Ranks the five product types with the most candidates. Reflects the active filters.
    trials:
      kpi:
        emerging: The number of those trials addressing emerging infectious diseases.
        neglected_diseases: The number of those trials addressing neglected diseases.
        total: The number of clinical trials linked to the pipeline that match the current filters.
        womens_health: The number of those trials addressing women's health conditions.
      top5_disease:
        title: Top 5 diseases by clinical trial count
        description: Ranks the five diseases with the most clinical trials, with bars colour-coded by global health area. Reflects the active filters.
      top5_product:
        title: Top 5 product types by clinical trial count
        description: Ranks the five product types with the most clinical trials. Reflects the active filters.
      age_groups:
        description: Proportion of clinical trial participants in each age bracket, highlighting which age groups are most and least represented across the portfolio.
        title: Age groups in clinical trials
      geo:
        description: The global heat map shows the country-level distribution of clinical trials, with darker shades indicating countries with higher numbers of studies, and can be filtered by clinical trial status.
        source: "Source: World Bank Official Boundaries"
        title: Geographic distribution of clinical trials
      intro: The clinical-trial layer of the pipeline — who is being studied, where, and at what stage. Two charts, a map and a searchable table cover age group, status, geography and trial-level detail.
      table:
        description: The clinical trial table is a matrix of individual studies, providing granular details such as title, clinical trial status, location, start date, URL and more. Use the per-column filters below each header to narrow results, then export the matching rows to .csv.
        empty: No clinical trials found
        title: Selected clinical trials
      trial_status:
        description: Number of studies at each stage across the portfolio, from ongoing to completed.
        title: Clinical trial status
    intro: |-
      Pipeline Explorer offers two complementary views of the pipeline. The visual insights view presents interactive charts across candidates, approved products, clinical trials and technology types; switch to the table builder view to assemble a custom dataset and export it as .csv.

      Page-level filters stay applied as you move across the tabs or to the table builder. Use Share this view to copy a link with your filters preserved. On every table you can sort by any column, use the Columns button (top right) to show, hide or reorder columns, and follow the Explore → link on any row to open the full record for that entity.
    tabs:
      approved_products: Approved Products
      candidates: Candidates
      clinical_trials: Clinical Trials
      technology_types: Technology types
    tech:
      back_to_vcp: Back to VCP
      candidates:
        empty: Select a technology type from the bar chart above to see candidates and approved products.
        empty_row:
          description: No rows match the selected filters.
          title: No candidates or approved products found
        title: Candidates and approved products
      chart:
        description: Each bar shows a technology type within the selected product, split by R&D stage.
      coverage:
        description: How the selected technology type covers individual diseases, split by global health area. Select a bar to see the candidates and approved products for that disease.
        empty: Select a technology type from the bar chart above to see disease coverage.
        title: Coverage across diseases
      section:
        description: Each card shows a product type with its total candidate count and technology count. Select a card to see how that product type breaks down by technology and R&D stage in the chart below.
        title: Product types and their technologies
      vcp_select_prompt: Select a category to explore its technology breakdown
  table_builder:
    intro: Build custom tables of candidates, approved products, clinical trials and R&D priorities, then export as CSV. Page-level filters stay applied across the Visual Insights view and Table Builder. Use Share this view to copy a link with your filters preserved. On every table you can sort by any column and use the Columns button (top right) to show, hide or reorder columns.
    candidates_approved:
      description: Candidates and approved products in a single table — useful for comparing the pipeline of in-development assets against what has already reached market. Filter by global health area, disease, product type or R&D stage, then sort and choose columns to fit the question at hand.
      title: Candidates & approved products
    clinical_trials:
      description: Clinical trials joined to the candidates they study — useful for tracing trial activity back to specific assets in the pipeline. Filter by global health area, disease or product type, then choose columns for trial-level detail.
      title: Clinical trials & candidates
    download_csv: Download CSV
    downloading: Downloading...
    empty_state:
      no_data_title: No results available
      no_results_description: No rows match the active filters. Clear them to see more.
      no_results_title: No results found
    rd_only:
      description: "R&D priorities on their own, no candidate join — useful for understanding the priority landscape itself: author, publication date, target population, efficacy and safety expectations, source. Filter by global health area or disease, then choose columns to focus on what matters."
      title: R&D priorities
    rd_priorities:
      description: R&D priorities joined to the candidates that address them — useful for seeing which priorities are well covered and which remain open. Filter by global health area or disease, then choose columns to compare priority detail against candidate progress.
      title: R&D priorities & candidates
    reset_filters: Reset filters
    tabs:
      candidates_approved: Candidates & approved products
      clinical_trials: Clinical trials & candidates
      rd_only: R&D priorities
      rd_priorities: R&D priorities & candidates
