guided_tour:
  confirm:
    prompt: Do you want to take a guided tour through the platform?
    no: No
    start: Start tour
  controls:
    navigating: Navigating to next page...
    next: Next
    finish: Finish
    step_of: of
  steps:
    "1":
      title: Navigate the platform
      description: Use the side menu to jump between Home, Pipeline Overview, Pipeline Explorer, Pipeline Trends and WHO Priority Alignment.
    "2":
      title: Navigate to main website
      description: Use the top menu to jump to the other components of the IGH website.
    "3":
      title: Hide side menu
      description: Click the « to hide the side bar and create more space to look at the visuals.
    "4":
      title: Overview of filters
      description: Every filter that is activated remains active throughout the portal. To deactivate a filter you can always see which filters are active in this filter screen.
    "5":
      title: Welcome to the Global Health R&D Pipeline
      description: |-
        This platform gives you an at-a-glance view of the global effort to develop new health products for the world’s most neglected diseases. The home page brings together key statistics from across the full pipeline — from early-stage candidates still in the lab, through to products that have reached the people who need them most.

        Each visual on this page offers a snapshot of a different dimension of that story: the scale of research activity across disease areas, where in the world trials are being conducted and developers are based, how pipelines are distributed across development stages, and how progress has shifted over time.

        Use the visuals to explore what interests you most, and follow the links to dive deeper into the detailed data and analysis available throughout the portal.
    "6":
      title: Download visual information
      description: Save a snapshot of this chart as an image, or download the underlying data to explore in your own tools.
    "7":
      title: Filters apply to all visuals on this page
      description: Use these filters to focus the data across every chart and map on this page at once. Any selection you make will automatically update all visuals to reflect your chosen scope.
    "8":
      title: Use legend to filter the visual
      description: Tick or untick the checkboxes in the legend to show or hide specific categories within the charts.
    "9":
      title: How do you like to look at the data?
      description: |-
        Visual insights: discover trends and patterns through interactive charts, maps and diagrams. A visual deep dive into the pipeline data.

        Table builder: filter and slice the data your way. Build a custom table and download it as .csv to use in your own analysis.
    "10":
      title: Explore the portfolio in depth
      description: Use the four tabs to dive deeper into your filtered selection. Each tab gives you a different lens on the data. Switch between them to explore active candidates, approved products, clinical trials and the technology types driving development across your chosen scope.
    "11":
      title: Welcome to cross-pipeline analysis
      description: Build and compare your own portfolios across the global health R&D landscape. Define a custom selection of diseases and product types, then compare how your portfolio has evolved over time or see how it stacks up against others. To get you started, the visual below gives you a taste of what’s possible.
    "12":
      title: Choose your comparison mode
      description: |-
        Decide how you want to explore the data.
        ✔ Compare single portfolio over time: Track how a single portfolio has changed across IGH’s annual pipeline snapshots.
        ✔ Compare different portfolios: Place up to four portfolios side by side to see how they differ at a single point in time.
    "13":
      title: Build your portfolio and select your years
      description: Choose the diseases and product types you want to include — these will be combined into a single portfolio. Then select the years you want to compare across. The available years reflect the annual snapshots IGH has taken of the global R&D pipeline over time.
    "14":
      title: Define and compare your portfolios
      description: Build up to four portfolios by selecting a disease and/or product type for each one. Use the + button to add more portfolios to your comparison. Once you’re happy with your selection, choose a single year and click Apply to see the results side by side.
    "15":
      title: Explore the WHO priorities
      description: Filter the disease on global health area, disease or product type to get an understanding of the WHO priorities that are developed for this selection.
    "16":
      title: Explore the priority in depth
      description: Select one specific priority and click on apply to load the pipeline that is related to that priority.
    "17":
      title: Click on Explore
      description: Click on explore in any table, to activate a slide-in panel that will show the in-depth information of that row in the table.
layout:
  filters:
    clear: Clear
    clear_all: Clear all
    disease: Disease
    global_health_area: Global health area
    product: Product
    product_type: Product type
    rd_phase: R&D phase
    rd_stage: R&D stage
  header:
    data:
      description: Here are the gold-standard databases and data visualizations of R&D funding, approved products and candidates in the pipeline for neglected diseases, emerging infectious diseases and maternal health.
      featured_title: Our data portals
      items:
        gfinder:
          description: Since 2007, the G-FINDER project tracks R&D funding for new products and technologies across global health areas.
          label: G-FINDER R&D funding portal
        pipeline:
          description: Our product pipeline portal provides an overview of health products approved or in development across global health areas.
          label: Product pipeline portal
        spillover:
          description: A tracker of health innovations developed for LMICs that have translated into new applications and benefits in HICs.
          label: Innovation Spillover Tracker
        snakebite:
          description: Database of all snakebite envenoming medicines with direct action on toxins.
          label: Snakebite Envenoming Medicines Database
    about:
      description: Meet the team working to create a more equitable future through global health innovation and impact.
      items:
        advocacy:
          description: Join us in creating global health impact with our advocacy and press kits.
          label: Advocacy Kits
        contact:
          description: Please get in touch with any questions or feedback. Between us, we cover most time zones so one of us will get back to you quickly.
          label: Contact Us
        council:
          description: Bringing together some of the leading and most influential figures in global health, our Council challenges our thinking, expands our foresight and helps us with horizon scanning.
          label: Our Global Advisory Council
        join:
          description: We build bridges, partnerships and consensus across the complex ecosystem of global health R&D players. Find out how to partner with us, commission our expertise, and how to join our team when we have vacancies.
          label: Join Us
        team:
          description: Meet our diverse international team of experts, who collate and analyse data on global health funding and the innovation pipeline.
          label: Our Team
    insights:
      description: Here you will find the analysis and insights to support decisions - whether you're funding research, setting policies, developing products or advocating for change.
      featured_title: Explore our hubs
      items:
        blindspots:
          description: PATH and Impact Global Health are joining forces to provide decision-makers with clarity and evidence on critical global health choices, with a focus on Africa.
          label: Impact Global Health and PATH R&D Blindspots Policy Series
        health_areas:
          description: This quick reference guide gives you a snapshot analysis of the R&D needs and the state of innovation to tackle each disease or condition we cover. It's a handy quick overview of what's needed to impact global health in these areas.
          label: Health areas
        hub_impact:
          description: Global, UK and EU analyses of the health and economic impact of the last two decades of investment in global health R&D.
          label: The Impact of Global Health R&D Hub
        hub_investment:
          description: A unique source of data and analysis tracking the funding of global health R&D and the pipeline of products in development. Powered by G-FINDER.
          label: The Investment Landscape Hub
        hubs:
          description: Themed collections of all the data, analysis and tools you need to understand the landscape and make smart decisions on global health R&D.
          label: Hubs
        reports:
          description: Our reports deliver critical insights using the evidence collected through G-FINDER and over two decades of independent analysis.
          label: Report Library
        womens_hub:
          description: This resource hub provides a suite of data, insights and tools to accelerate progress in women's health R&D.
          label: Women's Health Hub
    tools:
      description: We've created some practical frameworks and tools you can use to assess and increase impact in global health.
      featured_description: Join us in creating global health impact with our advocacy and press kits
      featured_title: Advocacy Kits
      items:
        100days:
          description: Is the world ready to deploy a new product to tackle an epidemic within 100 days of an outbreak?
          label: 100 Days Mission Scorecard
        framework:
          description: A global network of experts collaborated for two years to develop this comprehensive set of metrics that create an impact assessment framework for global health R&D.
          label: Impact Framework
    nav:
      about: About Us
      data: Data
      insights: Insights
      news: News
      tools: Tools
