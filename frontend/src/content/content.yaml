guided_tour:
  controls:
    navigating: Navigating to next page...
    next: Next
    back: Back
    finish: Finish
    step_of: of
  steps:
    "1":
      title: Welcome to the Product Pipeline Portal
      description: |-
        An at-a-glance view of health products approved or in development across three global health areas: neglected diseases, emerging infectious diseases and women’s health.

        **Home** — a snapshot of research activity, where trials and developers are located, how the pipeline is spread across development stages, and how progress has shifted over time.

        **Pipeline Overview** — filter and explore the data by global health area, disease, product type and R&D stage.

        **Pipeline Explorer** — explore candidates, approved products, clinical trials and technology types, as visuals or as a custom table.

        **Pipeline Trends** — see how the pipeline evolves over time and compare portfolios.

        **WHO Priority alignment** — map the pipeline against the World Health Organization’s product-development priorities.
    "2":
      title: Active filters
      description: See which filters are currently active. Use the x to remove a single filter, or Clear all to remove every filter — wherever in the portal it was applied.
    "3":
      title: Download visuals and data
      description: Wherever you see the three-dot menu, save the chart as an image or download the underlying data.
    "4":
      title: Filters apply to all pages
      description: Any filter you set here is applied across the whole portal, not only this page. Your selection stays with you as you move between pages.
    "5":
      title: Use the legend to filter the data in the visual
      description: Wherever a chart has a legend with tickboxes, tick or untick to show or hide those categories.
    "6":
      title: Two ways to explore
      description: |-
        Visual insights — discover trends and patterns through interactive charts, maps and diagrams.

        Table builder — filter and arrange columns to build a custom table, and download it as .csv.
    "7":
      title: Explore the portfolio in depth
      description: Switch between tabs to explore active candidates, approved products, clinical trials and the technology types driving development across the selected scope.
    "8":
      title: Build a portfolio and track it over time
      description: Define a selection of diseases and product types, then see how that portfolio has evolved over time.
    "9":
      title: Choose your comparison mode
      description: Compare a single portfolio across multiple years, or compare up to four portfolios against each other within a single year.
    "10":
      title: Explore the WHO priorities
      description: Filter by global health area, disease or product type to see which WHO priorities are covered by your selection.
    "11":
      title: Explore the pipeline for a WHO priority
      description: Select a priority and click Apply to load the pipeline related to it.
    "12":
      title: Understand the WHO priority
      description: Click Explore for key information on the priority, including intended use, target population, efficacy and safety.
    "13":
      title: Navigate back to Impact Global Health
      description: Use the top menu to return to the main IGH website and its other components.
methodology:
  page:
    title: How this pipeline is built
    intro: "Scope, sources, process, definitions and limitations of the Impact Global Health product R&D pipeline."
    body_intro: "The Impact Global Health R&D pipeline records the drugs, vaccines, diagnostics and other health products being developed for neglected diseases, emerging infectious diseases and women\u2019s health, together with those that have already been approved. It exists so that funders, researchers and policymakers can see what is being worked on, and what is not. This page sets out what the pipeline covers, where the information comes from, how records are reviewed and validated, and how far the pipeline can be relied on."
  tabs:
    methodology: Methodology
    what_we_track: What we track
  toc:
    title: Table of contents
  cta:
    title: Drop us a message!
    placeholder: Enter Email
    button: Get in touch
  toc_labels:
    scope: Scope
    where_information: Where the information comes from
    how_record_reaches: How a record reaches the pipeline
    definitions: Definitions
    limitations: Limitations
    corrections: Corrections and feedback
    version: Version and review cycle
  toc_annex_labels:
    annex_a: Neglected diseases
    annex_b: Emerging infectious diseases
    annex_c: "Women\u2019s health"
  scope:
    title: Scope
    p1: "The pipeline covers three global health areas: neglected diseases, emerging infectious diseases and women\u2019s health. Each area has a defined set of diseases or conditions, and each disease or condition has a defined set of product areas tracked for it. The annexes list these disease and product areas, along with any restrictions or partial-inclusion criteria that apply. These choices are fixed before a review begins and are not decided record by record."
    p2: "Across the pipeline, the tracked product areas are drugs, vaccines, biologics, diagnostics, microbicides, vector control products, dietary supplements and devices. Not every product area applies to every disease or condition. For example, vector control products apply only to selected neglected and emerging infectious diseases. Microbicides apply only to HIV/AIDS and to the three sexually transmitted infections tracked under women\u2019s health. Dietary supplements and devices apply only to selected women\u2019s health conditions."
    p3: "Inclusion is based on the combination of disease or condition and product area. If a product area is not tracked for a disease or condition, it is outside the pipeline\u2019s scope for that area, even where the work itself may be scientifically valuable. Some combinations are included only when they meet specific criteria."
    p4: "The unit of record is a candidate or an approved product, not a study. Clinical trials, publications and regulatory listings are evidence about products; they are not themselves the thing catalogued. Every inclusion and exclusion below turns on whether a specific candidate or approved product exists, and on what the available evidence tells us about it."
    p5: "To be included, a record must relate directly to the development, testing, approval or use of a specific candidate or approved product. This includes work that develops a new drug, vaccine, biologic, diagnostic, device or other tracked product area; tests a candidate or product in preclinical, clinical or field studies; supports regulatory approval or prequalification; or develops a new formulation, indication, dose, delivery method or use for an existing product."
    exclusions_intro: "The pipeline does not include work that falls outside direct product development. The main exclusions are:"
    exclusion_1_title: No identifiable candidate or product
    exclusion_1_desc: "Discovery or screening programmes are not included where no unique candidate, product concept or diagnostic concept has been defined. This includes target identification, biomarker discovery, and other early research that has not yet led to a specific candidate or product concept."
    exclusion_2_title: Non-product development research
    exclusion_2_desc: "Behavioural, educational, health-system and service-delivery interventions are not included, as they do not involve the development or assessment of a specific candidate or approved product."
    exclusion_3_title: Observational or non-interventional evidence
    exclusion_3_desc: "Candidates described only in observational or other non-interventional studies are not considered for inclusion, as these studies do not provide the type of product-development evidence used to assess pipeline records."
    exclusion_4_title: Comparator and control arms
    exclusion_4_desc: "Comparator, placebo and standard-of-care arms are not recorded as separate pipeline entries. Where a study includes an intervention being developed or assessed, only that unique candidate, product or regimen is considered for inclusion."
    exclusion_5_title: Nothing new being developed
    exclusion_5_desc: "Work on an already-marketed product is not included where nothing new is being developed for it. This covers safety and pharmacokinetic evidence that does not relate to a new formulation, and treatment-strategy work on the sequencing, switching or dose optimisation of products already on the market."
  where_information:
    title: Where the information comes from
    p1: "Each review uses two types of sources: common sources that are searched across all three global health areas, and targeted sources that are used for particular diseases, product areas or evidence needs. Using the same core sources in each cycle helps keep one review comparable with the next."
    p2: "The common sources are ClinicalTrials.gov, the World Health Organization International Clinical Trials Registry Platform, the biomedical database Embase, the FIND diagnostics pipeline, World Health Organization prequalification and emergency use listings, the US Food and Drug Administration, the European Medicines Agency and Japan\u2019s Pharmaceuticals and Medical Devices Agency."
    p3: "Clinical development candidates are sourced primarily from ClinicalTrials.gov and the World Health Organization International Clinical Trials Registry Platform. Discovery and preclinical candidates are sourced primarily from Embase, which captures relevant biomedical research that may be published or presented outside trial registries, including original research and conference abstracts. Reviews, editorials and commentary are not used to originate pipeline records."
    p4: "Regulatory and prequalification sources are used to identify candidates and products that have reached approval, authorisation, prequalification or emergency use listing. FIND is used as a specialist diagnostics source, because diagnostic candidates are not always well captured in trial registries."
    p5: "Targeted sources are selected for particular diseases, product areas or stages of development, rather than searched across every area in every cycle. They include product development portfolios published by organisations working in each disease area, and research grant databases maintained by major funders of global health R&D. They are sources of new information in their own right: candidates enter the pipeline from them directly, and grant databases in particular are a primary route to discovery and preclinical work that has not reached a trial registry. The difference between common and targeted sources is one of coverage, not standing."
    p6: "Impact Global Health\u2019s existing pipeline records are also used during each review. They help match new evidence against records already held, so that candidates and approved products are not counted twice under different names."
    p7: "Not every source can originate a record. Some sources are used only to verify or enrich information from another source, such as mechanism of action, molecular target or route of administration. These sources do not introduce candidates or approved products on their own."
    expandable_title: "Annex D \u2014 Targeted sources"
    expandable_subtitle: Which targeted sources are used, and whether each can originate a record
    expandable_intro_1: "Targeted sources sit alongside the common sources named in section 2. What separates them is coverage: common sources are searched across every global health area in every cycle, while targeted sources are selected for particular diseases, product areas or stages of development. Which ones are used varies by disease, product area and review cycle, so the list below is illustrative rather than exhaustive, and sources are added or dropped as evidence needs change."
    expandable_intro_2: "A separate distinction runs across all of them, and it is the one that matters for how a record is built: whether a source can originate a pipeline record, or is used only to verify and enrich records that another source originated. It is stated against each group below."
    source_1_title: Disease-area and product development portfolios
    source_1_badge: Can originate a record
    source_1_desc: "Candidates enter the pipeline from these portfolios directly. They also show where a developer\u2019s own account of a programme is fuller than the registry or literature record of it."
    source_1_nd: "For neglected diseases: Medicines for Malaria Venture, Drugs for Neglected Diseases initiative, TB Alliance, the International AIDS Vaccine Initiative, the Innovative Vector Control Consortium, and the World Health Organization\u2019s immunization, vaccines and biologicals programme and Vector Control Advisory Group."
    source_1_eid: "For emerging infectious diseases: the Coalition for Epidemic Preparedness Innovations, the International Vaccine Institute, the International AIDS Vaccine Initiative, the European Vaccine Initiative, Drugs for Neglected Diseases initiative, the Innovative Vector Control Consortium, the Sabin Vaccine Institute, the Rapidly Emerging Antiviral Drug Development Initiative, the RIGHT Fund, and the World Health Organization\u2019s immunization, vaccines and biologicals programme."
    source_2_title: Research grant databases
    source_2_badge: Can originate a record
    source_2_desc: "These are grant databases maintained by major funders of global health R&D. They are used to find candidates and to validate candidates already held, and they are a primary route to discovery and preclinical work that has not yet reached a trial registry or the published literature."
    source_2_wh: "For women\u2019s health: Impact Global Health\u2019s own G-FINDER R&D funding database; the United States National Institutes of Health\u2019s RePORTER; the UK Research and Innovation Gateway to Research; the Gates Foundation grants database; the European Commission\u2019s CORDIS; and the Swiss National Science Foundation grants database."
    source_3_title: Technical enrichment
    source_3_badge: "Verify and enrich only; never originates a record"
    source_3_desc: "AdisInsight is used to confirm and add technical detail on records already found \u2014 mechanism of action, molecular target, route of administration, drug class, alternative names, developer roles and regulatory flags. It is not searched for new candidates."
    source_4_title: Matching reference
    source_4_badge: Never originates a record
    source_4_desc: "Impact Global Health\u2019s existing pipeline records are carried into each review so new evidence can be matched against records already held. They are a reference for matching, not a source of new candidates."
  how_record_reaches:
    title: How a record reaches the pipeline
    intro: "A record moves through a structured review process before it is added to the published pipeline. The order of the steps is deliberate: scope is set first, sources are searched, records are reviewed and checked, and only then are they reconciled into the database."
    step_1: "Scope is fixed. This includes the diseases or conditions covered, the product areas tracked for each one, any partial-inclusion criteria, and the time period covered by the review. Setting this before searching begins helps ensure that records are assessed consistently, rather than decided case by case."
    step_2: "Sources are searched and relevant records are extracted. Each source is reviewed on its own terms, and the information is captured as it appears in that source before being assessed further."
    step_3: "Records are checked for duplicates. The same candidate often appears in more than one source, and under more than one name, so duplicates are identified before any further assessment."
    step_4: "Each record is classified by product name, target disease or condition, product area, R&D stage and developer, and matched against the pipeline records already held by Impact Global Health. This helps ensure that the same candidate or approved product is not counted twice under different names or from different sources."
    step_5: "Each record is reviewed by a subject-matter reviewer, who confirms or corrects the classification and matching, and records any changes made."
    step_6: Independent quality control is carried out before records are reconciled into the database and published.
    spine_note: "Each stage includes a sign-off point, so records are checked against the underlying source information before moving to the next stage."
    ai_title: The part artificial intelligence plays
    ai_p1: "Impact Global Health uses artificial intelligence to support the pipeline review process. Its role is to help retrieve records, extract structured information, match candidates and approved products across sources, add technical details and check consistency."
    ai_p2: "**Artificial intelligence does not decide whether a record is in scope, and it does not validate records for publication.** It is never the only source behind a record. Its outputs are treated as proposals."
    ai_p3: "Every record is reviewed by a subject-matter reviewer, and independent quality control is carried out before the record reaches the published pipeline."
  definitions:
    title: Definitions
    candidate_title: Candidate
    candidate_desc: "A candidate is a countermeasure that is still under investigation and has not yet been approved for the disease, condition or indication recorded in the pipeline. It may be a novel entity, or an approved product that is being developed for a new indication or use and is counted in the pipeline only where that new indication or use is in scope."
    approved_title: Approved
    approved_desc: "A product is recorded as approved when a recognised regulator or normative body has authorised it. The core regulatory authorities are the US Food and Drug Administration, the European Medicines Agency and Japan\u2019s Pharmaceuticals and Medical Devices Agency. Health Canada and Australia\u2019s Therapeutic Goods Administration are used as associate authorities. The World Health Organization is progressively replacing the stringent-regulatory-authority concept with its WHO-Listed Authority framework; the Therapeutic Goods Administration reached that status in December 2025, and in-vitro diagnostics are not yet within the framework\u2019s scope. Prequalification and emergency use listing are recorded alongside regulatory approval, and where approval is from another regulatory body, World Health Organization prequalification or emergency use listing may be used as the primary source. For diagnostics, approval status is based on what is listed by FIND and verified by Impact Global Health. Diagnostics also reach market through a wider range of routes than the authorities above, including CE marking, so a diagnostic may be legitimately on the market without appearing in any of them."
    product_areas_title: Product areas
    product_areas_intro: The pipeline groups records into product areas.
    product_areas_drugs: "Drugs include new chemical entities, repurposed compounds, fixed-dose combinations and regimens."
    product_areas_vaccines: "Vaccines are biological products used for prevention. They include traditional inactivated and subunit vaccines, as well as products using newer platforms such as viral vectors or mRNA, and may involve new antigens, adjuvanted formulations or new delivery platforms."
    product_areas_biologics: "Biologics are non-small-molecule products used as therapeutics, such as monoclonal antibodies, recombinant proteins, and gene and cell therapies; monoclonal antibodies are always recorded as biologics and never as drugs, and vaccines used for a therapeutic indication are also recorded as biologics."
    product_areas_diagnostics: "Diagnostics are defined by what they detect or measure, rather than by their regulatory classification."
    product_areas_microbicides: Microbicides are topical or intravaginal prevention products.
    product_areas_vector_control: "Vector control products include chemical products, biological products and vaccines given to animal reservoirs to help prevent transmission to people."
    product_areas_dietary_supplements: "Dietary supplements are products containing vitamins, minerals, amino acids, herbs or other substances intended to supplement the diet, tracked only for selected women\u2019s health conditions where they are formulated and dosed as standardised interventions."
    product_areas_devices: "Devices are instruments or appliances, with or without a pharmacological element, that facilitate delivery of a drug or biologic or control uterine bleeding, and are included only for selected women\u2019s health conditions."
    rd_stage_title: R&D stage
    rd_stage_desc: "Product areas do not all move through development in the same way, so the pipeline does not force every record onto a single stage scale. Drugs, vaccines, biologics and microbicides are staged from discovery and preclinical work through Phase I, II and III to approved. Diagnostics move from early development to late development to approved. Chemical vector control products move from screening and optimisation through development to prequalification listing or regulatory approval. Biological vector control products use their own Phase I to III scale, so a Phase II biological vector control product is not equivalent to a Phase II drug. Devices in clinical development with no clinical phase listed in the registry are marked as human safety and efficacy. Where there is no usable stage information, the record is shown as unclear or not applicable rather than assigned a stage."
  limitations:
    title: "Limitations \u2014 what this pipeline is not"
    p1: "The pipeline is not a market analysis. It does not assess market size, demand, pricing, access, procurement or commercial viability. Its purpose is to show what is in development, or already approved, within the defined scope of the pipeline."
    p2: "The pipeline is a point-in-time record. Each global health area is reviewed on its own cycle, and the published information reflects what was publicly available at the time of that review. New, changed or discontinued activity may not appear until the next review cycle."
    p3: "A missing candidate or product does not necessarily mean there is no activity in that area. It may be outside the pipeline\u2019s defined scope, not yet publicly disclosed, or not captured in the sources reviewed. Similarly, an area that is out of scope is not being judged as unimportant; it is simply not part of what this pipeline tracks."
    p4: "The pipeline depends on publicly available information. Development activity that is not registered, published, listed or otherwise publicly disclosed cannot be captured. Because the pipeline includes both candidates in development and approved products, counts should be read as covering both."
  corrections:
    title: Corrections and feedback
    p1: "If a record is missing, incorrect or out of date, please let us know through the help section on the pipeline home page. This could include a missing candidate or approved product, an incorrect developer or product name, a development stage that has changed, or a product that has since been approved or discontinued."
    p2: "Where possible, please include the product name, disease or condition, developer, and a public reference, such as a trial registration, publication, regulatory listing or organisational announcement. This helps us verify the information against a source."
    p3: All corrections are assessed against the same scope rules and review process as other pipeline records. If a submission falls outside the defined scope, it will not be added to the pipeline.
  version:
    title: Version and review cycle
    version_label: Version 1.0
    col_area: Area
    col_cycle: Review cycle
    row_nd_area: Neglected diseases
    row_nd_cycle: "Annual, March to June"
    row_eid_area: Emerging infectious diseases
    row_eid_cycle: "Annual, July to September"
    row_wh_area: "Women\u2019s health"
    row_wh_cycle: "Annual, October to December"
    footnote: "These cycles describe how the pipeline is maintained; they are not a commitment to a publication date."
  what_we_track:
    title: What we track
    annex_a:
      title: Neglected diseases
      label: Annex A
      subtitle: "Diseases tracked, and the product areas tracked for each. \u2713 \u2014 tracked. Partial \u2014 tracked against the criteria listed beneath the table. \u2013 \u2014 not tracked."
      partial_pneumo: "**Pneumococcal vaccines** \u2014 only vaccines developed for use in low- and middle-income countries, or to support registration there. A vaccine must be designed for infants under two years, give broad coverage across serotypes or focused protection against those prevalent in low- and middle-income countries (at minimum serotypes 1, 5 and 14), and match or improve on existing conjugate vaccines."
      partial_meningo: "**Meningococcal vaccines** \u2014 only conjugate vaccines covering serogroup A, designed for infants under two years and intended to cost under one US dollar per dose, developed for or being registered in low- and middle-income countries."
      partial_dengue_rota: "**Dengue and rotavirus vaccines** \u2014 only development specific to low- and middle-income countries."
      partial_diarrhoeal: "**Cholera, Shigella, cryptosporidiosis and multiple diarrhoeal diseases** \u2014 drugs only where they act on the pathogen; supportive therapies such as zinc, oral rehydration and nutritional supplements are excluded. Biologics only where developed for low- and middle-income country needs or registration there."
      partial_hepb: "**Hepatitis B** \u2014 drugs only where they are new drugs or reformulations for low- and middle-income country use, such as curative therapies, products preventing mother-to-child transmission, or long-acting formulations, or where they support registration there. Biologics on the same basis, and must cover the hepatitis B genotypes prevalent in low- and middle-income countries."
      partial_hepc: "**Hepatitis C** \u2014 drugs only where they are new drugs or reformulations for low- and middle-income country use, such as fixed-dose combinations, or support registration there."
      partial_hiv: "**HIV/AIDS** \u2014 drugs only where they are new drugs or reformulations for low- and middle-income country use: paediatric or slow-release formulations, fixed-dose combinations, low-dose formulations for prophylaxis, and long-acting injectables. Biologics only where developed for low- and middle-income country needs or registration there."
      partial_lepto: "**Leptospirosis diagnostics** \u2014 only tests suited to resource-limited settings: a test must detect the disease in its septicaemic or early acute phase, be accurate and easy to interpret with results within one to two hours, and be cheap, stable and usable without specialist equipment or highly trained staff."
      partial_snakebite: "**Snakebite envenoming** \u2014 drugs only where developed for low- and middle-income country needs, such as antivenoms incorporating small-molecule inhibitors or heat-stable venom-agnostic oral drugs, or supporting registration there. Biologics only where they are antivenom immunoglobulins based on the venom of snakes from those countries, or support registration there. Diagnostics only where capable of identifying envenomation by medically important snake species common to those countries."
      partial_yaws: "**Yaws diagnostics** \u2014 only novel point-of-care tests that identify a single active case of infection, detect resistance to azithromycin, or both."
      vector_title: Vector control products
      vector_p1: "Chemical vector control products are limited to active ingredients and formulations intended for public health use that inhibit, kill or repel vectors: new insecticides and formulations for treated nets and indoor residual spraying, systemic insecticides and endectocides, insecticide-based baits and traps, spatial repellents, and chemical larvicides. Biological vector control products are limited to innovative biological interventions such as microbial larvicides, sterilisation techniques and genetic modification. Reservoir-targeted vaccines are limited to veterinary vaccines developed specifically to prevent animal-to-human transmission."
      vector_p2: "Predation measures, habitat control and infrastructure measures are excluded, as are vaccines developed and used solely for veterinary purposes."
    annex_b:
      title: Emerging infectious diseases
      label: Annex B
      subtitle: "Fifteen pathogens are tracked: Lassa fever, Crimean-Congo haemorrhagic fever, Rift Valley fever, Hantaan virus, Andes virus, Sin Nombre virus, Middle East respiratory syndrome, COVID-19, Ebola, Marburg, Zika, highly pathogenic avian influenza A(H5N1), Nipah, mpox and chikungunya."
      callout: "**Drugs, vaccines, biologics and diagnostics are tracked for every one of them.** Vector control products are tracked where applicable. Microbicides do not apply in this area, and no disease in it carries a partial inclusion."
      notes_title: Qualifying notes
      note_1: "**Vector control products** divide into chemical products, biological products and reservoir-targeted vaccines. Which apply to a given pathogen depends on whether it is vector-borne and whether it has an animal reservoir. For pathogens that are not vector-borne, the category covers only veterinary vaccines developed specifically to prevent transmission from animals to people."
      note_2: "**Influenza** is tracked only for products specific to H5N1, and for pan-influenza products that provide H5N1 coverage. Seasonal influenza is not in scope."
      note_3: "**Dengue** is tracked under neglected diseases, not here. No dengue disease-product combination is recorded in this area."
      note_4: "**Andes virus and Sin Nombre virus** enter the pipeline with the 2026 cycle. Neither was curated in an earlier review, so their records begin from a longer look-back than the other pathogens."
    annex_c:
      title: "Women\u2019s health"
      label: Annex C
      summary: "Women\u2019s health covers ten conditions in three groups: three gynaecological conditions, four maternal conditions, and three sexually transmitted infections carrying a risk of antimicrobial resistance. The product areas tracked differ by group, so each group has its own table."
      qualifying: "Across all three groups, a product qualifies whether it is a new entity, an existing product being repurposed or extended to a new label, or a new formulation or dose of something already registered. Predictive or diagnostic strategies with no identifiable product are not tracked, and neither are risk models that combine several separately evaluated parameters into a single entry, nor clinical guidelines and criteria, which are not products."
      gynae_title: Gynaecological conditions
      gynae_p1: "Products are tracked where they prevent or treat the condition or its symptoms. For endometriosis that includes pain, migration of endometrial tissue, endometrial lesions and related infertility, and extends to products regulating the menstrual cycle. For polyendocrine metabolic ovarian syndrome it includes products targeting hyperandrogenism, metabolic regulation, fertility and menstrual cycle regulation. For uterine fibroids it includes menstrual cycle regulation, shrinking or preventing fibroids, and pain management."
      gynae_p2: "A device here means an instrument or appliance, with or without a pharmacological element, intended to deliver a drug or biologic or to control uterine bleeding. Diagnostics cover predictive, screening and diagnostic tests: biochemical markers, non-biomarker tests and fixed multiparametric tests alike."
      gynae_p3: "Not tracked: dietary supplements, for any of the three conditions; and surgical interventions, whether used to treat or to diagnose. Products must be applicable to use in low- and middle-income settings."
      maternal_title: Maternal conditions
      maternal_p1: "Every maternal condition tracks drugs, biologics and dietary supplements. Diagnostics are tracked for three of the four \u2014 preterm labour/birth, preeclampsia/eclampsia and intrauterine growth restriction. Devices are tracked for postpartum haemorrhage only."
      maternal_p2: "Across the group, products must be intended for pregnant women, or for lactating mothers within the postpartum period, taken as the first 42 days after birth. Products are tracked whatever setting they are intended for, high-income or otherwise."
      maternal_p3: "**Diagnostics** cover predictive, screening and diagnostic tests, including maternal and fetal biochemical serum markers, non-biomarker tests and fixed multiparametric tests. Clinical criteria already in routine use \u2014 blood pressure measurement, urinalysis, uric acid measurement \u2014 are not products and are not tracked."
      maternal_p4: "**Devices for postpartum haemorrhage** must have standalone action to prevent or control bleeding: balloon, suction or sponge tamponades, tools assisting bimanual compression, and devices with wider application that have demonstrated use against postpartum haemorrhage. A device combined with a pharmaceutical element qualifies only where the device and the pharmaceutical element each act independently against the bleed. Not tracked: devices used in management that do not control bleeding, such as cell salvage for blood replacement; diagnostic devices such as those measuring blood loss; devices that only deliver a medicine, which are captured as medicines instead; digital tools guiding diagnosis and management; and embolisation and surgical procedures."
      sti_title: Sexually transmitted infections with risk of antimicrobial resistance
      sti_p1: "These three infections are tracked because each carries a risk of antimicrobial resistance. Resistance is already documented in all three: in Neisseria gonorrhoeae to both traditional and currently recommended treatments, in Mycoplasma genitalium to azithromycin and to alternative regimens, and in Trichomonas vaginalis to nitroimidazoles, the only drug class with demonstrated efficacy against it."
      sti_p2: "Drugs and biologics are tracked where they prevent transmission, prevent acquisition of the infection, or clear it. Vaccines are tracked on the same basis, whether preventive or therapeutic, though a vaccine developed for a therapeutic indication is recorded as a biologic. Microbicides are tracked where they are topical products preventing transmission of one of the three infections and are suitable for low- and middle-income settings \u2014 heat stable and easy to use, for instance. Diagnostics cover both tests for the infection itself and tests for antimicrobial resistance."
      sti_p3: "Not tracked: dietary supplements. Products must be applicable to use in low- and middle-income settings."
