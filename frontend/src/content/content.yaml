    geo_source: "Source: World Bank Official Boundaries"
    geo_title: "Geographic distribution of clinical trials"
    intro: "The clinical-trial layer of the pipeline — who is being studied, where, and at what stage. Two charts, a map and a searchable table cover age group, status, geography and trial-level detail."
    table_description: "The clinical trial table is a matrix of individual studies, providing granular details such as title, clinical trial status, location, start date, URL and more. Use the per-column filters below each header to narrow results, then export the matching rows to .csv."
    table_empty: "No clinical trials found"
    table_title: "Selected clinical trials"
    trial_status_description: "Number of studies at each stage across the portfolio, from ongoing to completed."
    trial_status_title: "Clinical trial status"
