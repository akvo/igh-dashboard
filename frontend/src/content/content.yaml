    rd_stage: R&D stage
  header:
    data:
      description: Here are the gold-standard databases and data visualizations of R&D funding, approved products and candidates in the pipeline for neglected diseases, emerging infectious diseases and maternal health.
      featured_title: Our data portals
      items:
        gfinder:
          description: Since 2007, the G-FINDER project tracks R&D funding for new products and technologies across global health areas.
          label: G-FINDER R&D funding portal
        pipeline:
          description: Our product pipeline portal provides an overview of health products approved or in development across global health areas.
          label: Product pipeline portal
        spillover:
          description: A tracker of health innovations developed for LMICs that have translated into new applications and benefits in HICs.
          label: Innovation Spillover Tracker
        snakebite:
          description: Database of all snakebite envenoming medicines with direct action on toxins.
          label: Snakebite Envenoming Medicines Database
    about:
      description: Meet the team working to create a more equitable future through global health innovation and impact.
      items:
        advocacy:
          description: Join us in creating global health impact with our advocacy and press kits.
          label: Advocacy Kits
        contact:
          description: Please get in touch with any questions or feedback. Between us, we cover most time zones so one of us will get back to you quickly.
          label: Contact Us
        council:
          description: Bringing together some of the leading and most influential figures in global health, our Council challenges our thinking, expands our foresight and helps us with horizon scanning.
          label: Our Global Advisory Council
        join:
          description: We build bridges, partnerships and consensus across the complex ecosystem of global health R&D players. Find out how to partner with us, commission our expertise, and how to join our team when we have vacancies.
          label: Join Us
        team:
          description: Meet our diverse international team of experts, who collate and analyse data on global health funding and the innovation pipeline.
          label: Our Team
    insights:
      description: Here you will find the analysis and insights to support decisions - whether you're funding research, setting policies, developing products or advocating for change.
      featured_title: Explore our hubs
      items:
        blindspots:
          description: PATH and Impact Global Health are joining forces to provide decision-makers with clarity and evidence on critical global health choices, with a focus on Africa.
          label: Impact Global Health and PATH R&D Blindspots Policy Series
        health_areas:
          description: This quick reference guide gives you a snapshot analysis of the R&D needs and the state of innovation to tackle each disease or condition we cover. It's a handy quick overview of what's needed to impact global health in these areas.
          label: Health areas
        hub_impact:
          description: Global, UK and EU analyses of the health and economic impact of the last two decades of investment in global health R&D.
          label: The Impact of Global Health R&D Hub
        hub_investment:
          description: A unique source of data and analysis tracking the funding of global health R&D and the pipeline of products in development. Powered by G-FINDER.
          label: The Investment Landscape Hub
        hubs:
          description: Themed collections of all the data, analysis and tools you need to understand the landscape and make smart decisions on global health R&D.
          label: Hubs
        reports:
          description: Our reports deliver critical insights using the evidence collected through G-FINDER and over two decades of independent analysis.
          label: Report Library
        womens_hub:
          description: This resource hub provides a suite of data, insights and tools to accelerate progress in women's health R&D.
          label: Women's Health Hub
    tools:
      description: We've created some practical frameworks and tools you can use to assess and increase impact in global health.
      featured_description: Join us in creating global health impact with our advocacy and press kits
      featured_title: Advocacy Kits
      items:
        100days:
          description: Is the world ready to deploy a new product to tackle an epidemic within 100 days of an outbreak?
          label: 100 Days Mission Scorecard
        framework:
          description: A global network of experts collaborated for two years to develop this comprehensive set of metrics that create an impact assessment framework for global health R&D.
          label: Impact Framework
