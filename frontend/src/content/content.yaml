    approved_product_desc: "Ranks the five product types with the most approved products. Reflects the active filters."
    candidates_disease: "Top 5 diseases by candidate count"
    candidates_disease_desc: "Ranks the five diseases with the most candidates, with bars colour-coded by global health area. Reflects the active filters."
