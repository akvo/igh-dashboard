    chart_description: "Each bar shows a technology type within the selected product, split by R&D stage."
    coverage_description: "How the selected technology type covers individual diseases, split by global health area. Select a bar to see the candidates and approved products for that disease."
    coverage_empty: "Select a technology type from the bar chart above to see disease coverage."
    coverage_title: "Coverage across diseases"
    section_description: "Each card shows a product type with its total candidate count and technology count. Select a card to see how that product type breaks down by technology and R&D stage in the chart below."
    section_title: "Product types and their technologies"
    vcp_select_prompt: "Select a category to explore its technology breakdown"
